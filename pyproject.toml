[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-harness"
dynamic = ["version", "dependencies"]
description = "Provider-agnostic eval harness for LLM-powered apps: regression gating against committed baselines, judge calibration, repeat-sampling for flakiness, cost/budget controls, and local-model support."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.dynamic]
version = { attr = "harness.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["harness"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
